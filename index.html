<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compensalud IPS - Verificación</title>

<style>.whatsapp-box{
    margin-top:30px;
    padding:20px;
    background:#f8fff8;
    border:2px solid #0b7d3e;
    border-radius:10px;
    text-align:center;
}

.whatsapp-box h3{
    color:#0b7d3e;
    margin-top:0;
}

.whatsapp-box img{
    margin:15px 0;
    max-width:180px;
}
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

header{
    background:white;
    text-align:center;
    padding:30px;
    border-bottom:5px solid #0b7d3e;
}

header img{
    width:180px;
}

header h1{
    color:#0b7d3e;
    margin:10px 0;
}

.container{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#0b7d3e;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#086530;
}

#resultado{
    display:none;
    margin-top:20px;
    background:#eef9f1;
    padding:20px;
    border-left:5px solid #0b7d3e;
    border-radius:8px;
}

footer{
    text-align:center;
    margin:40px;
    color:#666;
}
</style>

</head>

<body>

<header>

<img src="LOGO COMPENSALUD.png" alt="Compensalud IPS">

<h1>COMPENSALUD IPS</h1>

<p>Verificación de Exámenes Médicos Ocupacionales</p>

</header>

<div class="whatsapp-box">
    <h3>📄 ¿Necesita el certificado en PDF?</h3>

    <p>
        Solicítelo directamente a <strong>COMPENSALUD IPS</strong>
        escaneando el siguiente código QR o escribiéndonos por WhatsApp.
    </p>

    <img src="whatsapp.jpg.jpeg" alt="QR WhatsApp" width="180">

    <p>
<strong>WhatsApp:</strong>
<a href="https://wa.me/573204109109" target="_blank">
320 410 9109
</a>
</p>
</div>

<footer>
© 2026 Compensalud IPS
</footer>

<script>
async function consultar() {

    const cedula = document.getElementById("cedula").value.trim();

    if (cedula === "") {
        alert("Ingrese una cédula.");
        return;
    }

    const url = "https://script.google.com/macros/s/AKfycbwLPkx2ospT72p-5AmJb5ISyJR0xdnChoMHlxTHvZTq7O4psBqCxJGdGHKd5pD4yD5m/exec?cedula=" + cedula;

    try {

        const respuesta = await fetch(url);
        const datos = await respuesta.json();

        document.getElementById("resultado").style.display = "block";

        if (datos.error) {
            document.getElementById("resultado").innerHTML =
            "<h3>Documento no encontrado.</h3>";
            return;
        }

        document.getElementById("resultado").innerHTML = `
            <h3>Resultado de la consulta</h3>
            <p><strong>Documento:</strong> ${datos.documento}</p>
            <p><strong>Nombre:</strong> ${datos.nombre}</p>
            <p><strong>Empresa:</strong> ${datos.empresa}</p>
            <p><strong>Cargo:</strong> ${datos.cargo}</p>
            <p><strong>Fecha:</strong> ${datos.fecha}</p>
            <p><strong>Tipo de examen:</strong> ${datos.examen}</p>
            <p><strong>Estado:</strong> ${datos.estado}</p>
            <p><strong>Código de verificación:</strong> ${datos.codigo}</p>
        `;

    } catch (e) {
        alert("Error al consultar la base de datos.");
        console.error(e);
    }

}
</script>

</body>
</html>
