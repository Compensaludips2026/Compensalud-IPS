LOGO COMPENSALUD.png<header>
    <img src="LOGOTIPO COMPENSALUD.png" alt="Logo Compensalud IPS" width="180">

    <h1>COMPENSALUD IPS</h1>

    <p>Verificación de Exámenes Médicos Ocupacionales</p>
</header>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compensalud IPS - Verificación</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

header{
    background:#0b7d3e;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-top:10px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    background:#0b7d3e;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#08642f;
}

#resultado{
    margin-top:25px;
    padding:15px;
    background:#eef9ee;
    border-radius:5px;
}
</style>

</head>

<body>

<header>
<h1>COMPENSALUD IPS</h1>
<p>Verificación de Exámenes Médicos Ocupacionales</p>
</header>

<div class="container">

<label><strong>Número de documento</strong></label>

<input
type="text"
id="documento"
placeholder="Ingrese su número de documento">

<button onclick="verificar()">
Verificar
</button>

<div id="resultado">
Ingrese un número de documento y pulse <b>Verificar</b>.
</div>

</div>

<script>

function verificar(){

let doc=document.getElementById("documento").value;

if(doc=="12345678"){

document.getElementById("resultado").innerHTML=
"<h3>✅ Documento encontrado</h3>"+
"<b>Nombre:</b> Juan Pérez<br>"+
"<b>Documento:</b> 12345678<br>"+
"<b>Tipo:</b> Examen de Ingreso<br>"+
"<b>Estado:</b> Apto";

}else{

document.getElementById("resultado").innerHTML=
"❌ No se encontró información para ese documento.";

}

}

</script>

</body>
</html>
