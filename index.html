<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compensalud IPS - Verificación</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

header{
    background:white;
    color:#0b7d3e;
    text-align:center;
    padding:30px 20px;
    border-bottom:5px solid #0b7d3e
}

header img{
    width:170px;
    margin-bottom:15px;
}

header h1{
    margin:10px 0 5px;
}

header p{
    margin:0;
    font-size:18px;
}

.container{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:#0b7d3e;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#096431;
}

#resultado{
    margin-top:30px;
    background:#eef9f1;
    border-left:6px solid #0b7d3e;
    padding:20px;
    border-radius:8px;
    display:none;
}

footer{
    text-align:center;
    color:#666;
    margin:40px;
}

</style>

</head>

<body>

<header>

<img src="LOGO COMPENSALUD.png" alt="Logo Compensalud IPS">

<h1>COMPENSALUD IPS</h1>

<p>Verificación de Exámenes Médicos Ocupacionales</p>

</header>

<div class="container">

<h2>Consultar Certificado</h2>

<label>Número de documento</label>

<input
type="text"
id="cedula"
placeholder="Ingrese la cédula">

<button onclick="consultar()">
Consultar
</button>

<div id="resultado">

<h3>Resultado de la consulta</h3>

<p><strong>Nombre:</strong> Francisco Javier Cruz Sanchez</p>

<p><strong>Cédula:</strong> 1024509118</p>

<p><strong>Estado:</strong> activo</p>

<p><strong>Fecha:</strong> 12/06/2026</p>

<p><strong>Tipo de examen:</strong> enfacis alturas</p>

</div>

</div>

<footer>

© 2026 Compensalud IPS

</footer>

<script>

function consultar() {

    let cedula = document.getElementById("cedula").value.trim();

    if (cedula === "") {
        alert("Ingrese un número de documento.");
        return;
    }

    window.open("Certificados/" + cedula + ".pdf", "_blank");

}
}

}

</script>

</body>
</html>
